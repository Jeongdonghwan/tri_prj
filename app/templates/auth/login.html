<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — {{ APP_NAME }}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-tripleup.svg') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font,'Pretendard Variable',sans-serif);min-height:100vh;
       background:#0e0b28;color:#fff;overflow:hidden;display:grid;place-items:center}
  /* 움직이는 오로라 그라데이션 + 떠다니는 빛망울 */
  .sky{position:fixed;inset:0;overflow:hidden;z-index:0;
       background:linear-gradient(120deg,#1a1548,#241a5e,#3a2170,#1a2a63,#1a1548);
       background-size:400% 400%;animation:aurora 18s ease infinite}
  @keyframes aurora{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 16s ease-in-out infinite}
  .b1{width:420px;height:420px;background:#7c5cff;left:-80px;top:-60px}
  .b2{width:360px;height:360px;background:#4f7cff;right:-60px;top:20%;animation-duration:20s;animation-delay:-4s}
  .b3{width:480px;height:480px;background:#a855f7;left:20%;bottom:-140px;animation-duration:22s;animation-delay:-8s}
  .b4{width:300px;height:300px;background:#22d3ee;right:14%;bottom:-40px;opacity:.35;animation-duration:24s;animation-delay:-2s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.12)}66%{transform:translate(-30px,25px) scale(.92)}}
  .grain{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%, transparent 55%, rgba(8,6,26,.55) 100%)}

  .wrap{position:relative;z-index:1;width:100%;max-width:400px;padding:20px}
  .card{background:#fbfbfe;color:#1a1730;border-radius:18px;padding:30px 30px 26px;
        box-shadow:0 30px 70px rgba(10,8,40,.55)}
  .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:20px}
  .brand img{height:30px}
  .brand b{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#1a1730}
  .greet{background:#f2f1fb;border-radius:12px;padding:14px 16px;margin-bottom:20px}
  .greet b{display:block;font-size:14px;margin-bottom:4px}
  .greet span{font-size:12.5px;color:#6b6788}
  label.fl{display:block;font-size:12.5px;font-weight:700;color:#3b3760;margin:0 0 6px 2px}
  .f{margin-bottom:14px}
  .inp{position:relative}
  .inp input{width:100%;height:46px;border:1px solid #e3e1f0;border-radius:10px;padding:0 42px 0 14px;
             font-size:14px;background:#fff;color:#1a1730;outline:none;transition:.15s}
  .inp input:focus{border-color:#6c5ce7;box-shadow:0 0 0 3px rgba(108,92,231,.15)}
  .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;
       color:#9c98b5;padding:6px;display:grid;place-items:center}
  .remember{display:flex;align-items:center;gap:7px;font-size:13px;color:#4b4770;margin:2px 0 18px 2px;cursor:pointer;user-select:none}
  .remember input{width:16px;height:16px;accent-color:#6c5ce7}
  .btn-login{width:100%;height:48px;border:0;border-radius:10px;cursor:pointer;font-size:15px;font-weight:800;color:#fff;
             background:linear-gradient(90deg,#6c5ce7,#8b5cf6 60%,#a855f7)}
  .btn-login:hover{filter:brightness(1.05)}
  .foot{text-align:center;font-size:12px;color:#8b88a5;margin-top:14px}
  /* 토스트 */
  .toast{position:fixed;top:16px;right:16px;z-index:10;display:flex;align-items:center;gap:8px;
         background:#fff;color:#1a1730;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:600;
         box-shadow:0 10px 30px rgba(10,8,40,.35)}
  .toast .ic{width:18px;height:18px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
  .dev{border-top:1px solid #eceaf5;margin-top:18px;padding-top:14px;text-align:center}
  .dev a{display:inline-block;margin:0 4px;font-size:12px;color:#6c5ce7;text-decoration:none;border:1px solid #e3e1f0;border-radius:8px;padding:5px 10px}
</style>
</head>
<body>
{% with msgs = get_flashed_messages() %}{% if msgs %}
  <div class="toast"><span class="ic">✓</span>{{ msgs[0] }}</div>
{% endif %}{% endwith %}

<div class="sky">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="grain"></div>
</div>

<div class="wrap">
  <div class="card">
    <div class="brand"><img src="{{ url_for('static', filename='img/logo-tripleup.svg') }}" alt=""><b>트리플업</b></div>
    <div class="greet"><b>안녕하세요, 트리플업입니다.</b><span>쇼핑 순위 관리 서비스 이용을 위해 로그인 해주세요.</span></div>
    <form method="post" action="/auth/login{% if next_url %}?next={{ next_url | urlencode }}{% endif %}">
      <div class="f"><label class="fl">아이디</label>
        <div class="inp"><input type="text" id="username" name="username" required autocomplete="username" autofocus></div>
      </div>
      <div class="f"><label class="fl">비밀번호</label>
        <div class="inp"><input type="password" id="password" name="password" required autocomplete="current-password">
          <button class="eye" type="button" id="eye" aria-label="비밀번호 표시">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <label class="remember"><input type="checkbox" id="remember">아이디 기억하기</label>
      <button class="btn-login" type="submit">로그인</button>
    </form>
    <div class="foot">계정은 관리자가 발급합니다. 발급 문의는 담당자에게 연락해주세요.</div>
    {% if dev_mode %}
    <div class="dev">
      <span style="font-size:11px;color:#b0adc4">개발용</span><br>
      <a href="/auth/dev-login?as=user{% if next_url %}&next={{ next_url | urlencode }}{% endif %}">일반(demo)</a>
      <a href="/auth/dev-login?as=admin">관리자(admin)</a>
    </div>
    {% endif %}
  </div>
</div>

<script>
(function () {
  var u = document.getElementById('username'), r = document.getElementById('remember');
  try {
    var saved = localStorage.getItem('tripleup_id');
    if (saved) { u.value = saved; r.checked = true; document.getElementById('password').focus(); }
  } catch (e) {}
  document.querySelector('form').addEventListener('submit', function () {
    try {
      if (r.checked) localStorage.setItem('tripleup_id', u.value.trim());
      else localStorage.removeItem('tripleup_id');
    } catch (e) {}
  });
  var eye = document.getElementById('eye'), pw = document.getElementById('password');
  eye.addEventListener('click', function () { pw.type = pw.type === 'password' ? 'text' : 'password'; });
})();
</script>
</body>
</html>
