{# Mobile (<768) bottom tab bar: 홈 / 캠페인 / 공지 / 마이 / 메뉴 #}
<nav class="bottom-tab">
  <a href="/"{% if request.path == '/' %} class="on"{% endif %}><i data-lucide="house" class="i"></i>홈</a>
  <a href="/campaign/store"{% if request.path.startswith('/campaign') %} class="on"{% endif %}><i data-lucide="shopping-bag" class="i"></i>캠페인</a>
  <a href="/notice"{% if request.path.startswith('/notice') %} class="on"{% endif %}><i data-lucide="megaphone" class="i"></i>공지</a>
  <a href="/my"{% if request.path.startswith('/my') %} class="on"{% endif %}><i data-lucide="user" class="i"></i>마이</a>
  <button type="button" data-side-toggle><i data-lucide="menu" class="i"></i>메뉴</button>
</nav>
